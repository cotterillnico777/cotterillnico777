[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rechnungsbruecke"
version = "1.1.0"
description = "CSV-Rechnungsexporte in XRechnung/ZUGFeRD umwandeln, E-Rechnungen lesen und prüfen"
requires-python = ">=3.10"
# Exakt die getesteten Versionen. Aktualisierung nur bewusst: Version ändern, alle Tests inklusive
# offizieller Regelprüfung (RB_REGELN) und PDF/A-Prüfung (werkzeuge/pdfa_pruefen.sh) laufen lassen.
dependencies = [
    "lxml==6.1.3",
    "reportlab==5.0.1",
    "pypdf==6.21.1",
    "factur-x==7.7",
    "pillow==13.0.0",
    "cryptography==50.0.2",
    "saxonche==13.1.0",
]

[project.scripts]
rechnungsbruecke = "rechnungsbruecke.cli:main"

[tool.setuptools]
packages = ["rechnungsbruecke"]

[tool.setuptools.package-data]
rechnungsbruecke = ["beispiele/*", "oberflaeche.html"]
